[pytest]
# -rs: always report which tests were skipped and why.
#
# A skip is a test declining to check something, and by default pytest
# says only how many. That is the same shape as the bug the row decoder
# exists to prevent -- an empty result and a clean exit reading as "there
# was nothing to find". A run that skips 32 tests because an option was
# not passed should say so without anyone having to know to ask.
#
# Reporting only. Nothing here assumes a privilege or an environment:
# --create-objects stays off by default and stays a decision made at the
# command line.
addopts = -rs
